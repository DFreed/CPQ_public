<style>
:root{--bg:#eef0ec;--panel:#fff;--ink:#18201b;--muted:#67716a;--line:#d9ddd6;--brand:#1f9446;--err:#c2412d}
@media (prefers-color-scheme:dark){:root{--bg:#101411;--panel:#171c18;--ink:#e6ebe6;--muted:#8d978f;--line:#2b332d;--brand:#34b35c;--err:#ec6a55;color-scheme:dark}}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px;width:100%;max-width:360px;display:grid;gap:14px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.brand{display:flex;align-items:center;gap:10px;font:700 20px/1 "Arial Narrow",Arial,sans-serif}
p{margin:0;color:var(--muted);font-size:13.5px}label{font-size:12.5px;color:var(--muted)}
input{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;box-sizing:border-box}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:10px;background:var(--brand);color:#fff;cursor:pointer}
button[disabled]{opacity:.6}.err{color:var(--err);font-size:13px;min-height:1.2em}
:focus-visible{outline:2px solid #e8962a;outline-offset:2px}
</style></head><body>
